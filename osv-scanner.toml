[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
reason = "minimatch@10.2.6 is a transitive dependency of @actions/glob@0.7.0 (latest available) and is only present at dev/build time. The bundled action (dist/) ships minimatch@6.0.0, which is outside the affected range (>=10.0.0 <11.0.1), so the action itself is not impacted. The fix requires minimatch>=11.0.1, but @actions/glob has not released an update that pins to minimatch 11.x. This cannot be remediated without an upstream release from the actions/toolkit project."
